<!doctype html>
<html lang="en" data-theme="poster" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Just Dance Butt Queue</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&family=Unbounded:wght@500;800&family=Inter+Tight:wght@400;500;600;700&family=Manrope:wght@500;600;800&family=Fredoka:wght@500;700&family=Nunito:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="queue-shell">
      <header class="queue-header">
        <div class="queue-title">
          <p class="eyebrow jd-label">Song queue · !sr</p>
          <h1 class="jd-display">Up next</h1>
        </div>
        <div class="count jd-display" id="count" aria-label="Songs in queue">0</div>
      </header>

      <section class="now-playing" id="now-playing" hidden>
        <span class="jd-label">Now playing</span>
        <strong id="last-song"></strong>
      </section>

      <ol class="queue-list" id="queue"></ol>

      <p class="empty" id="empty">Type <strong>!sr</strong> and a song name in chat to join the queue.</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
