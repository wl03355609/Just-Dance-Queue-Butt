<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JD Queue Butt Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/dashboard.css">
  </head>
  <body class="dashboard-page">
    <main class="dashboard-shell">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">Streamer Controls</p>
          <h1>Request Dashboard</h1>
        </div>
        <div class="dashboard-header-actions">
          <button id="theme-toggle-button" class="theme-toggle-button" type="button" aria-label="Switch to light mode" title="Switch to light mode">
            <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
            <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
          </button>
          <a class="overlay-link" href="/" target="_blank" rel="noreferrer">Overlay</a>
        </div>
      </header>

      <section class="status-bar" aria-label="Status">
        <div>
          <span>Channel</span>
          <strong id="channel">-</strong>
        </div>
        <div>
          <span>Bot</span>
          <strong id="bot-status">Offline</strong>
        </div>
        <div>
          <span>Queue</span>
          <strong><span id="queue-count">0</span>/<span id="queue-limit">0</span></strong>
        </div>
        <div>
          <span>Songs</span>
          <strong id="song-count">0</strong>
        </div>
      </section>

      <section class="current-playing" id="current-playing" aria-label="Current playing">
        <div>
          <span>Current playing</span>
          <strong id="current-playing-title"></strong>
          <em id="current-playing-detail"></em>
        </div>
      </section>

      <section class="control-strip" aria-label="Queue Controls">
        <button id="queue-toggle-button" type="button" class="danger">Close Queue</button>
        <button id="skip-button" type="button">Next</button>
        <button id="clear-button" type="button" class="danger">Clear Queue</button>
      </section>

      <section class="filter-panel" aria-label="Filtering Games">
        <button id="filter-toggle" type="button" class="panel-heading collapsible-heading" aria-expanded="false" aria-controls="filter-body">
          <span class="collapsible-heading-main">
            <span class="collapsible-chevron" aria-hidden="true">▸</span>
            <h2>Filtering Games</h2>
          </span>
          <span id="filter-count">0 active</span>
        </button>
        <div id="filter-body" class="filter-body" hidden>
          <div class="filter-actions">
            <button id="select-all-filters" type="button">Select All</button>
            <button id="deselect-all-filters" type="button">Deselect All</button>
          </div>
          <div id="game-filters" class="filter-grid"></div>
          <button id="apply-filters" type="button">Apply Filters</button>
        </div>
      </section>

      <section class="add-panel" aria-label="Add Request">
        <form id="request-form">
          <label>
            Song
            <input id="request-song" name="song" list="song-list" autocomplete="off" placeholder="Search song or artist">
            <datalist id="song-list"></datalist>
          </label>
          <button type="submit">Add</button>
        </form>
        <p id="message" class="message" role="status"></p>
      </section>

      <section class="dashboard-grid">
        <div class="tool-panel">
          <div class="panel-heading">
            <h2 id="queue-heading">Queue</h2>
            <span id="queue-heading-count">0 waiting</span>
          </div>
          <ol id="dashboard-queue" class="dashboard-list"></ol>
          <p class="empty compact" id="dashboard-empty">No requests yet.</p>
        </div>

        <div class="tool-panel">
          <div class="panel-heading">
            <h2>History</h2>
            <span>Last 10</span>
          </div>
          <ol id="history" class="dashboard-list"></ol>
          <p class="empty compact" id="history-empty">No played songs yet.</p>
        </div>
      </section>
    </main>

    <script src="/dashboard.js"></script>
  </body>
</html>
