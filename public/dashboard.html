<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Just Dance Request Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/dashboard.css">
  </head>
  <body class="dashboard-page">
    <main class="dashboard-shell">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">Streamer Controls</p>
          <h1>Request Dashboard</h1>
        </div>
        <a class="overlay-link" href="/" target="_blank" rel="noreferrer">Overlay</a>
      </header>

      <section class="status-bar" aria-label="Status">
        <div>
          <span>Channel</span>
          <strong id="channel">-</strong>
        </div>
        <div>
          <span>Bot</span>
          <strong id="bot-status">Offline</strong>
        </div>
        <div>
          <span>Queue</span>
          <strong><span id="queue-count">0</span>/<span id="queue-limit">0</span></strong>
        </div>
        <div>
          <span>Songs</span>
          <strong id="song-count">0</strong>
        </div>
      </section>

      <section class="control-strip" aria-label="Queue Controls">
        <button id="skip-button" type="button">Next</button>
        <button id="clear-button" type="button" class="danger">Clear Queue</button>
      </section>

      <section class="pairing-panel" aria-label="Phone Pairing">
        <div class="panel-heading">
          <h2>Phone Pairing</h2>
          <span id="pairing-status">Hidden</span>
        </div>
        <div class="pairing-row">
          <button id="show-pairing-code" type="button">Show Code</button>
          <div id="dashboard-pairing-code-panel" class="pairing-code-panel" hidden>
            <div class="pairing-code-header">
              <span>Pairing code</span>
              <div class="otp-wrap">
                <small>Code rotates in</small>
                <div id="dashboard-pairing-code-timer" class="otp-timer">
                  <span id="dashboard-pairing-code-countdown">5:00</span>
                </div>
              </div>
            </div>
            <strong id="dashboard-pairing-code"></strong>
            <small id="dashboard-pairing-code-status"></small>
          </div>
        </div>
      </section>

      <section class="appearance-panel" aria-label="Overlay Appearance">
        <div class="panel-heading">
          <h2>Overlay Appearance</h2>
          <span id="overlay-theme-label">Dark</span>
        </div>
        <div class="theme-toggle" role="group" aria-label="Overlay Theme">
          <button id="theme-dark" type="button" data-theme="dark" aria-pressed="true">Dark</button>
          <button id="theme-light" type="button" data-theme="light" aria-pressed="false">Light</button>
        </div>
      </section>

      <section class="filter-panel" aria-label="Filtering Games">
        <div class="panel-heading">
          <h2>Filtering Games</h2>
          <span id="filter-count">0 active</span>
        </div>
        <div class="filter-actions">
          <button id="select-all-filters" type="button">Select All</button>
          <button id="deselect-all-filters" type="button">Deselect All</button>
        </div>
        <div id="game-filters" class="filter-grid"></div>
        <button id="apply-filters" type="button">Apply Filters</button>
      </section>

      <section class="add-panel" aria-label="Add Request">
        <form id="request-form">
          <label>
            Song
            <input id="request-song" name="song" list="song-list" autocomplete="off" placeholder="Search song or artist">
            <datalist id="song-list"></datalist>
          </label>
          <button type="submit">Add</button>
        </form>
        <p id="message" class="message" role="status"></p>
      </section>

      <section class="dashboard-grid">
        <div class="tool-panel">
          <div class="panel-heading">
            <h2>Queue</h2>
            <span id="queue-heading-count">0 waiting</span>
          </div>
          <ol id="dashboard-queue" class="dashboard-list"></ol>
          <p class="empty compact" id="dashboard-empty">No requests yet.</p>
        </div>

        <div class="tool-panel">
          <div class="panel-heading">
            <h2>History</h2>
            <span>Last 10</span>
          </div>
          <ol id="history" class="dashboard-list"></ol>
          <p class="empty compact" id="history-empty">No played songs yet.</p>
        </div>
      </section>
    </main>

    <script src="/dashboard.js"></script>
  </body>
</html>
