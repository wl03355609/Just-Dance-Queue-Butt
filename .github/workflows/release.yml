name: Release

# Builds the Windows installer on a Windows runner and publishes it as a
# GitHub release (with the latest.yml the desktop auto-updater needs).
#
# Trigger by pushing a version tag, e.g.:
#   git tag v0.10.0 && git push origin v0.10.0
# The package.json version must match the tag (without the leading "v").
#
# electron-builder publishes a DRAFT release with the assets attached. The
# release notes are taken from RELEASE_NOTES.md. Review the draft and the
# installer, then publish it (the GitHub "Publish release" button, or
# `gh release edit <tag> --draft=false`) — publishing is what rolls the
# update out to existing users via the auto-updater.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Build & publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --ia32 --publish always

      - name: Apply release notes to draft
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
            echo "Applied RELEASE_NOTES.md to ${GITHUB_REF_NAME} (still a draft)."
          else
            echo "No RELEASE_NOTES.md found; leaving electron-builder's default notes."
          fi
